{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="form-glass">
            <h2 class="text-center mb-4 fw-bold"><i class="bi bi-box-arrow-in-right" style="color: var(--primary);"></i> Iniciar Sesión</h2>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-neon w-100">ENTRAR</button>
            </form>

            <p class="text-center mt-4 mb-0 text-secondary">
                ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}" style="color: var(--primary);">Regístrate</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
