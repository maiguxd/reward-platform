{% extends "base.html" %}
{% block title %}Registro{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="form-glass">
            <h2 class="text-center mb-4 fw-bold"><i class="bi bi-person-plus" style="color: var(--primary);"></i> Registrarse</h2>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required minlength="3">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmar Contraseña</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-neon w-100">REGISTRARSE</button>
            </form>

            <p class="text-center mt-4 mb-0 text-secondary">
                ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}" style="color: var(--primary);">Inicia sesión</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
